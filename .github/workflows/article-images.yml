name: RudraNāda article images
on:
  workflow_dispatch:
    inputs:
      slug:
        description: Existing article slug with approved image manifest
        type: string
        required: true
  push:
    branches: [main]
    paths:
      - 'data/article-visuals/*.json'

permissions:
  contents: write

concurrency:
  group: rudranaada-images-main
  cancel-in-progress: false

jobs:
  produce:
    if: github.ref_name == 'main' && (github.event_name == 'workflow_dispatch' || vars.ENABLE_AUTO_ARTICLE_IMAGES == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020c4 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
      - name: Generate images and attach to article
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          if [ -n "$SLUG" ]; then
            [[ "$SLUG" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]] || exit 1
            node scripts/generate-article-images.mjs "data/article-visuals/$SLUG.json" --generate
          else
            for manifest in data/article-visuals/*.json; do
              node scripts/generate-article-images.mjs "$manifest" --generate
            done
          fi
      - name: Check real images exist and are referenced
        run: node scripts/verify-article-images.mjs
      - name: Build final article
        run: npm run build
      - name: Commit finished assets
        run: |
          set -euo pipefail
          git config user.name 'rudranaada-image-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/images/articles lib/*-article.ts
          if ! git diff --cached --quiet; then
            git commit -m 'Attach RudraNāda article images'
            git push origin HEAD:main
          fi

      - name: Verify production after Vercel deploys
        env:
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          if [ -n "$SLUG" ]; then
            node scripts/verify-production-article.mjs "$SLUG"
          else
            for manifest in data/article-visuals/*.json; do
              slug="$(basename "$manifest" .json)"
              node scripts/verify-production-article.mjs "$slug"
            done
          fi
